name: Compilar APK Android
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Isolando Arquivos Web
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true

      - name: Instalar Capacitor CLI & Gerar Projeto Android
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Meu App Web" "com.meuempresa.meuapp" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compilar APK Debug com Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Salvar APK como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: Meu_App_Web-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
